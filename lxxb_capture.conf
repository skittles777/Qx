# ============================================
# 灵犀晓伴 App 抓包配置（QuantumultX）
# ============================================
# 
# 使用方法：
# 1. 将以下内容合并到你的 QX 配置文件中
# 2. 确保 lxxb_capture.js 已在 QX 的 scripts 目录中
# 3. 开启 MITM（QX设置 → MITM → 开启）
# 4. 如果未安装QX证书，先到 MITM设置 里生成并安装CA证书
# 5. 打开 QX 日志窗口（底部 → 日志）
# 6. 打开晓伴App进行操作
# 7. 所有HTTP请求/响应会自动打印到日志
#
# 抓包完成后：
# 1. 从QX日志中找到关键接口（登录、签到、领券等）
# 2. 记录：URL、Method、Headers（Token/Cookie）、Body、Response
# 3. 将这些信息整理后提供给我，我来开发Web管理端
# ============================================

# ---------- [mitm] ----------
# 晓伴App相关域名（通配符匹配）
# 如果抓包发现遗漏的域名，在这里添加

[mitm]
hostname = *.lxxb.com, *.suxiaoban.com, *.allcam.com.cn, *.js.10086.cn, app.10086.cn, wx.10086.cn, *.cmcc.com, *.chinamobile.com, *.migudm.cn


# ---------- [rewrite_local] ----------
# 抓包规则 — 请求头拦截（抓URL、Token、Cookie）

[rewrite_local]
# === 请求头拦截 ===
^https?:\/\/.*\.lxxb\.com\/.* url script-request-header lxxb_capture.js
^https?:\/\/.*\.suxiaoban\.com\/.* url script-request-header lxxb_capture.js
^https?:\/\/.*\.allcam\.com\.cn\/.* url script-request-header lxxb_capture.js
^https?:\/\/.*\.js\.10086\.cn\/.* url script-request-header lxxb_capture.js
^https?:\/\/app\.10086\.cn\/.* url script-request-header lxxb_capture.js
^https?:\/\/wx\.10086\.cn\/.* url script-request-header lxxb_capture.js

# === 请求体拦截 ===
^https?:\/\/.*\.lxxb\.com\/.* url script-request-body lxxb_capture.js
^https?:\/\/.*\.suxiaoban\.com\/.* url script-request-body lxxb_capture.js
^https?:\/\/.*\.allcam\.com\.cn\/.* url script-request-body lxxb_capture.js
^https?:\/\/.*\.js\.10086\.cn\/.* url script-request-body lxxb_capture.js
^https?:\/\/app\.10086\.cn\/.* url script-request-body lxxb_capture.js
^https?:\/\/wx\.10086\.cn\/.* url script-request-body lxxb_capture.js

# === 响应体拦截 ===
^https?:\/\/.*\.lxxb\.com\/.* url script-response-body lxxb_capture.js
^https?:\/\/.*\.suxiaoban\.com\/.* url script-response-body lxxb_capture.js
^https?:\/\/.*\.allcam\.com\.cn\/.* url script-response-body lxxb_capture.js
^https?:\/\/.*\.js\.10086\.cn\/.* url script-response-body lxxb_capture.js
^https?:\/\/app\.10086\.cn\/.* url script-response-body lxxb_capture.js
^https?:\/\/wx\.10086\.cn\/.* url script-response-body lxxb_capture.js

# ---------- [task_local] ----------
# 暂时不需要定时任务，纯手动抓包

# ============================================
# 注意事项：
#
# 1. 域名可能不全
#    晓伴App可能还调用了其他域名（如CDN、第三方SDK等）
#    如果日志中没有看到关键请求，可以临时把 hostname 改为 * 抓所有流量
#    （但这会抓到大量无关请求，建议先用上面的域名试试）
#
# 2. 证书信任
#    iOS上需要到 设置 → 通用 → 关于本机 → 证书信任设置 
#    里手动开启QX CA证书的完全信任
#
# 3. 抓不到HTTPS？
#    - 确认MITM已开启
#    - 确认CA证书已安装并信任
#    - 确认晓伴App在hostname匹配范围内
#    - 尝试关闭App重新打开
#
# 4. 抓包完成后
#    把QX日志中标记为 📤[请求] 和 📻[响应] 的内容截图或复制给我
#    我需要以下信息来开发Web管理端：
#    - 登录接口（发送验证码、验证码登录）
#    - 签到接口
#    - 领券/领Token接口
#    - 活动列表接口
#    - 用户信息/余额接口
# ============================================
