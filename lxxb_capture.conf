# ============================================
# 灵犀晓伴 App 抓包 - QX Rewrite 规则
# ============================================
#
# ⚠️ 重要：这个文件只包含 rewrite 规则
#   hostname 需要你手动加到 QX 主配置的 [mitm] 段中
#
# 使用方法（二选一）：
#
# 方式A（推荐）：直接复制规则到QX主配置
#   1. 打开 QX → 设置 → 配置文件 → 编辑
#   2. 找到 [mitm] 段，在 hostname= 后面加上：
#      *.lxxb.com, *.suxiaoban.com, *.allcam.com.cn
#   3. 找到 [rewrite_local] 段，把下面的规则全部粘贴进去
#   4. 保存
#
# 方式B：作为远程配置引用
#   把此文件上传到GitHub，在QX中引用为远程rewrite
#   但hostname仍然需要手动加到主配置的[mitm]段
#
# hostname 需要添加的域名（复制到QX [mitm] 段的 hostname= 后面）：
#   *.lxxb.com, *.suxiaoban.com, *.allcam.com.cn
# ============================================

# === 请求头拦截（抓URL、Token、Cookie） ===
^https?:\/\/.*\.lxxb\.com\/.* url script-request-header lxxb_capture.js
^https?:\/\/.*\.suxiaoban\.com\/.* url script-request-header lxxb_capture.js
^https?:\/\/.*\.allcam\.com\.cn\/.* url script-request-header lxxb_capture.js

# === 请求体拦截（抓POST参数） ===
^https?:\/\/.*\.lxxb\.com\/.* url script-request-body lxxb_capture.js
^https?:\/\/.*\.suxiaoban\.com\/.* url script-request-body lxxb_capture.js
^https?:\/\/.*\.allcam\.com\.cn\/.* url script-request-body lxxb_capture.js

# === 响应体拦截（抓服务器返回数据） ===
^https?:\/\/.*\.lxxb\.com\/.* url script-response-body lxxb_capture.js
^https?:\/\/.*\.suxiaoban\.com\/.* url script-response-body lxxb_capture.js
^https?:\/\/.*\.allcam\.com\.cn\/.* url script-response-body lxxb_capture.js
